[project]
name = "sandhi-probe"
version = "0.1.0"
description = "Measuring how tokenizers destroy Sanskrit sandhi boundaries (SBDS)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "indic-transliteration>=2.3.82",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "transformers>=5.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandhi_probe"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
# Everyone gets the same uv-managed CPython, whatever is (or isn't) on their PATH.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
